<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NAME}} — CV</title>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('{{FONTS_DIR}}/space-grotesk-latin.woff2') format('woff2');
    font-weight: 300 700; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Space Grotesk';
    src: url('{{FONTS_DIR}}/space-grotesk-latin-ext.woff2') format('woff2');
    font-weight: 300 700; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'DM Sans';
    src: url('{{FONTS_DIR}}/dm-sans-latin.woff2') format('woff2');
    font-weight: 100 1000; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'DM Sans';
    src: url('{{FONTS_DIR}}/dm-sans-latin-ext.woff2') format('woff2');
    font-weight: 100 1000; font-style: normal; font-display: swap;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    font-family: 'DM Sans', sans-serif; font-size: 11px;
    line-height: 1.5; color: #1a1a2e; background: #fff; padding: 0; margin: 0;
  }
  .page { width: 100%; max-width: 210mm; margin: 0 auto; padding: 2px 0; }

  .header { margin-bottom: 20px; }
  .header h1 {
    font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700;
    color: #1a1a2e; letter-spacing: -0.02em; margin-bottom: 6px; line-height: 1.1;
  }
  .header-gradient {
    height: 2px; background: linear-gradient(to right, hsl(187,74%,32%), hsl(270,70%,45%));
    border-radius: 1px; margin-bottom: 10px;
  }
  .contact-row {
    display: flex; flex-wrap: wrap; gap: 8px 14px;
    font-size: 10.5px; line-height: 1.4; color: #555;
  }
  .contact-row a { color: #555; text-decoration: none; }
  .contact-row .sep { color: #ccc; }

  .section { margin-bottom: 18px; }
  .section-title {
    font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em; color: hsl(187,74%,32%);
    border-bottom: 1.5px solid #e2e2e2; padding-bottom: 4px; margin-bottom: 10px;
  }
  .summary-text { font-size: 11px; line-height: 1.7; color: #2f2f2f; }
  a { white-space: nowrap; }

  .competencies-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .competency-tag {
    font-size: 10px; font-weight: 500; color: hsl(187,74%,28%);
    background: hsl(187,40%,95%); padding: 4px 10px; border-radius: 3px;
    border: 1px solid hsl(187,40%,88%);
  }

  .job { margin-bottom: 14px; break-inside: avoid; }
  .job-header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  .job-company { font-family: 'Space Grotesk', sans-serif; font-size: 12.5px; font-weight: 600; color: hsl(270,70%,45%); }
  .job-period { font-size: 10.5px; color: #777; white-space: nowrap; }
  .job-role { font-size: 11px; font-weight: 600; color: #333; margin-bottom: 6px; }
  .job ul { padding-left: 18px; margin-top: 6px; }
  .job li { font-size: 10.5px; line-height: 1.6; color: #333; margin-bottom: 4px; }
  .job li strong { font-weight: 600; }

  .project { margin-bottom: 12px; break-inside: avoid; }
  .project-title { font-family: 'Space Grotesk', sans-serif; font-size: 11.5px; font-weight: 600; color: hsl(270,70%,45%); }
  .project-link { color: hsl(187,74%,32%); font-size: 10px; }
  .project-desc { font-size: 10.5px; color: #444; margin-top: 3px; line-height: 1.55; }

  .edu-item { margin-bottom: 8px; break-inside: avoid; }
  .edu-header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .edu-title { font-weight: 600; font-size: 11px; color: #333; }
  .edu-org { color: hsl(270,70%,45%); font-weight: 500; }
  .edu-year { font-size: 10px; color: #777; white-space: nowrap; }
  .edu-desc { font-size: 10px; color: #666; margin-top: 2px; }

  .skills-grid { display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .skill-category { font-weight: 600; color: #333; font-size: 10.5px; }
  .skill-item { font-size: 10.5px; color: #444; }

  @media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } .page { padding: 0; } }
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <h1>{{NAME}}</h1>
    <div class="header-gradient"></div>
    <div class="contact-row">
      <span>{{EMAIL}}</span>
      <span class="sep">|</span>
      <span>{{PHONE}}</span>
      <span class="sep">|</span>
      <a href="https://{{LINKEDIN}}">{{LINKEDIN}}</a>
      <span class="sep">|</span>
      <a href="https://{{GITHUB}}">{{GITHUB}}</a>
      <span class="sep">|</span>
      <span>{{LOCATION}}</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Professional Summary</div>
    <div class="summary-text">{{SUMMARY}}</div>
  </div>

  {{COMPETENCIES_SECTION}}

  <div class="section">
    <div class="section-title">Work Experience</div>
    {{EXPERIENCE}}
  </div>

  <div class="section">
    <div class="section-title">Projects</div>
    {{PROJECTS}}
  </div>

  <div class="section">
    <div class="section-title">Education</div>
    {{EDUCATION}}
  </div>

  <div class="section">
    <div class="section-title">Technical Skills</div>
    <div class="skills-grid">
      {{SKILLS}}
    </div>
  </div>

</div>
</body>
</html>
